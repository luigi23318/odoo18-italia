issuer: Alibaba.com Singapore E-Commerce Pte Ltd
keywords:
  - Alibaba
  - AliExpress
fields:
  invoice_number: 'Invoice\s+(?:No\.?|number|#)[:\s]+(\S+)'
  date: '(?:Invoice\s+)?[Dd]ate[:\s]+(\d{4}-\d{2}-\d{2})'
  amount_total: 'Total[:\s]+(?:USD|EUR)\s*([\d.,]+)'
  amount_untaxed: '(?:Subtotal|Net)[:\s]+(?:USD|EUR)\s*([\d.,]+)'
options:
  currency: USD
  date_formats:
    - '%Y-%m-%d'
    - '%d/%m/%Y'
  decimal_separator: '.'
static_fields:
  supplier_country: SG
  tipo_documento: TD17
  description_type: SERVIZI
